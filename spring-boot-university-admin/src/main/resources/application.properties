# ==========================================
# application.properties - Spring Boot 配置文件
#
# 这个文件替代了 Spring MVC 版中整个 AppConfig.java
# 的所有 Bean 定义！
#
# Spring Boot 的 "自动配置"（Auto-Configuration）
# 会根据 classpath 中的依赖自动创建 Bean。
# 我们只需要在这里告诉 Spring Boot 一些"个性化"的
# 参数值即可。
#
# 原理：Spring Boot 启动时会加载上百个
# AutoConfiguration 类，每个类都会检查：
#   1. classpath 中是否有某个类（如 DataSource）
#   2. 有没有对应的自定义配置（如 spring.datasource.*）
#   3. 如果没有自定义 Bean，就自动创建一个默认的
# 这就是"约定优于配置"的体现。
# ==========================================

# ==========================================
# 服务器配置（对比 applicationContext.xml / server.xml）
# ==========================================

# 服务器端口号（Spring MVC 版在 pom.xml 中配置）
server.port=8080

# 应用上下文路径：访问 URL 的前缀
# 完整 URL：http://localhost:8080/spring-boot-university-admin/
server.servlet.context-path=/spring-boot-university-admin

# ==========================================
# 数据源配置（对比 AppConfig.java 中的 dataSource() 方法）
#
# Spring Boot 的 DataSourceAutoConfiguration
# 检测到 classpath 有 H2 驱动 + HikariCP，
# 自动创建 DataSource Bean。
# 我们只需要提供连接参数。
# ==========================================

# JDBC 连接地址（H2 内存数据库，和 Java EE / Spring MVC 版一致）
spring.datasource.url=jdbc:h2:mem:universitydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# ==========================================
# JPA 配置（对比 AppConfig.java 中的 entityManagerFactory() 方法）
#
# Spring Boot 的 HibernateJpaAutoConfiguration
# 检测到 classpath 有 Hibernate + DataSource，
# 自动创建 EntityManagerFactory Bean。
# 我们只需要告诉它：
#   1. 是否自动建表（ddl-auto）
#   2. 数据库方言（自动检测 H2）
#   3. 是否打印 SQL（方便调试）
# ==========================================

# ddl-auto = create-drop：
#   启动时建表，关闭时删表（适合学习和开发）
#   对应 Java EE 版 persistence.xml 中的
#   javax.persistence.schema-generation.database.action
spring.jpa.hibernate.ddl-auto=create-drop

# 在控制台打印 Hibernate 生成的 SQL
spring.jpa.show-sql=true

# 格式化 SQL，方便阅读
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 自动检测 H2 数据库方言，不需要手动配置
# 如果自动检测失败，可以取消下面这行的注释：
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ==========================================
# Spring MVC 视图配置（对比 WebMvcConfig.java）
#
# Spring Boot 的 WebMvcAutoConfiguration
# 自动创建 InternalResourceViewResolver。
# 我们只需要设置前缀和后缀即可。
# ==========================================

# 视图文件前缀：Controller 返回 "student/list"
# → 框架自动拼接成 /pages/student/list.jsp
spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# ==========================================
# 日志配置
# ==========================================

# 设置 com.university 包的日志级别为 DEBUG
# 这样我们在控制台能看到 @Slf4j 打印的日志
logging.level.com.university=DEBUG

# ==========================================
# 总结：这个文件就相当于 Spring MVC 版的
# AppConfig.java + WebMvcConfig.java + 部分 pom.xml
# Spring Boot 通过 "自动配置 + 属性文件"
# 大大减少了配置代码量。
# ==========================================
